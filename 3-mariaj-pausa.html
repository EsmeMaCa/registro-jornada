<!doctype html>
<!--documento html5 moderno-->

<html lang="es">

    <!--conecta esta página de html con el archivo de estillos css-->
  </head>

  <body>

    <a href="index.html" class="cerrar">✕</a>
    <!--cruz que redirige a la página principal de index.html-->
